
name: TURBOFUSION M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: turbofusion-hourly
  cancel-in-progress: false

jobs:
  run-turbofusion:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Executer TURBOFUSION
        run: |
          python main.py
