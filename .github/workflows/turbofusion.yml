
name: TURBOFUSION M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-automatic
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le logiciel
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Executer TURBOFUSION
        env:
          TZ: Europe/Paris
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -f main.py ]; then
            python main.py
          elif [ -f main-5.py ]; then
            python main-5.py
          else
            echo "ERREUR: fichier Python introuvable"
            exit 1
          fi

      - name: Enregistrer les resultats
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation automatique TURBOFUSION"
            git push
          fi
          
