
name: TURBOFUSION M1-M5 Automatique

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-automatic
  cancel-in-progress: false

jobs:
  analyse:
    name: Analyse hippique M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executer TURBOFUSION
        env:
          TZ: Europe/Paris
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: Archiver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbofusion-rapports
          path: |
            reports/
            data/
            logs/
          if-no-files-found: ignore
          retention-days: 30
          
