name: TURBOFUSION M1-M5 - Automatique

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-automatic
  cancel-in-progress: false

jobs:
  analyse:
    name: Analyse PMU M1-M5
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier les fichiers
        shell: bash
        run: |
          set -euo pipefail

          test -f main.py || {
            echo "::error::main.py introuvable"
            exit 1
          }

          test -f scripts/sync_dashboard.py || {
            echo "::error::sync_dashboard.py introuvable"
            exit 1
          }

          python -m py_compile \
            main.py \
            scripts/sync_dashboard.py

      - name: Installer les dependances
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install \
              -r requirements.txt
          else
            echo "::warning::requirements.txt absent"
          fi

      - name: Preparer les dossiers
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p rapports_turbofusion
          mkdir -p figes_turbofusion

          echo "Preparation terminee"
          TZ=Europe/Paris date

      - name: Executer TURBOFUSION M1-M5
        id: moteurs
        shell: bash
        run: |
          set -euo pipefail

          echo "Demarrage des analyses"
          echo "Heure de Paris :"
          TZ=Europe/Paris date

          python main.py

          echo "Execution principale terminee"

      - name: Synchroniser le tableau de bord
        if: steps.moteurs.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          python scripts/sync_dashboard.py

          if [ ! -f dashboard.json ]; then
            echo "::error::dashboard.json absent"
            exit 1
          fi

          python -m json.tool \
            dashboard.json > /dev/null

          echo "Tableau de bord valide"

      - name: Archiver les resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbofusion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dashboard.json
            rapports_turbofusion/
            figes_turbofusion/
          if-no-files-found: warn
          retention-days: 30

      - name: Publier les resultats
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            dashboard.json \
            rapports_turbofusion/ \
            figes_turbofusion/

          if git diff --cached --quiet; then
            echo "Aucune modification"
            exit 0
          fi

          git commit -m \
            "Actualisation TURBOFUSION M1-M5"

          for tentative in 1 2 3; do
            echo "Publication tentative $tentative"

            if git fetch origin main; then
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  echo "Publication reussie"
                  exit 0
                fi
              fi
            fi

            git rebase --abort || true

            echo "::warning::Nouvelle tentative"
            sleep $((tentative * 5))
          done

          echo "::error::Publication impossible"
          exit 1

      - name: Bilan final
        if: always()
        shell: bash
        run: |
          echo "================================"
          echo "TURBOFUSION M1-M5"
          echo "================================"

          echo "Heure de Paris :"
          TZ=Europe/Paris date

          echo "Statut : ${{ job.status }}"
          echo "Run : ${{ github.run_id }}"

          echo "================================"
          
