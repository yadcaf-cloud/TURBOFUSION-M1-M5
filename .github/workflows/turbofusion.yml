
name: TURBOFUSION X1000 M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: turbofusion-x1000
  cancel-in-progress: false

jobs:
  analyse-hippique:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Executer TURBOFUSION
        run: |
          if [ -f main.py ]; then
            python main.py
          elif [ -f main-5.py ]; then
            python main-5.py
          else
            echo "ERREUR : programme Python introuvable"
            exit 1
          fi

      - name: Sauvegarder les donnees
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation TURBOFUSION"
            git push
          fi
          
